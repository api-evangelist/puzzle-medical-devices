aid: puzzle-medical-devices
name: Puzzle Medical Devices
description: >-
  Puzzle Medical Devices Inc. is a Montreal, Quebec based clinical-stage medical
  device company founded in 2018 by Jade Doucet-Martineau, Gabriel Georges and
  Francois Trudeau. It develops ModulHeart, a modular percutaneous mechanical
  circulatory support pump for patients with advanced heart failure, anchored in the
  descending aorta to reduce cardiac afterload and improve renal perfusion.
  ModulHeart holds FDA Breakthrough Device Designation and has completed a
  first-in-human study. The company is a hardware manufacturer, not a software
  vendor - it publishes no developer program, API reference, SDK or machine-readable
  contract. Its only agent-reachable surface is a Model Context Protocol endpoint
  provisioned automatically by Wix, its website host, which serves public site
  content rather than any product capability.
