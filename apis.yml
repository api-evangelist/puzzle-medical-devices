apis:
- aid: puzzle-medical-devices-site-mcp
  name: Puzzle Medical Devices Site MCP
  description: >-
    An anonymous Model Context Protocol endpoint served from www.puzzlemed.com and
    advertised by the company's own /llms.txt. It is the Wix platform Site Visitor
    Assistant, provisioned by the website host rather than authored by Puzzle
    Medical, and it exposes nine generic tools for reading public site content,
    business details, and the Wix platform's own API documentation. It is not a
    product, device or clinical API. Recorded because it is live, callable without
    credentials, and self-identifies as belonging to this company.
