  http_status: 200
  method: 'POST {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
  content_type: application/json
  advertised_by: https://www.puzzlemed.com/llms.txt
  initialize_response:
    protocolVersion: '2025-06-18'
    server_name: 'Site Visitor Assistant for site "Puzzle Medical Devices" (https://www.puzzlemed.com/_api/mcp)'
    server_version: 1.0.0
