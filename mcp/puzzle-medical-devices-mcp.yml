generated: '2026-08-26'
method: probed
source: https://www.puzzlemed.com/_api/mcp
name: Puzzle Medical Devices Site MCP
description: >-
  A live, anonymous Model Context Protocol endpoint served from Puzzle Medical
  Devices' own host (www.puzzlemed.com). It is the Wix platform "Site Visitor
  Assistant" MCP, provisioned automatically by the company's website host, NOT a
  first-party product API. It exposes generic site-content and Wix-platform tools
  (business details, in-site search, Wix docs traversal, and a generic Wix API
  caller) rather than anything specific to the ModulHeart device or to any Puzzle
  Medical software product. It is recorded here because it is genuinely reachable
  by an agent today, and because the endpoint self-identifies as belonging to this
  company.

deployment:
  mode: remote
  endpoint: https://www.puzzlemed.com/_api/mcp
  install: null
  package: null
  auth: none
  verified: probed

x-evidence:
  fetched: '2026-08-26'
